name: mac

on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run the unchanged native build and complete Mac suite
        type: boolean
        default: false
      nice_startup_diagnostic:
        description: Diagnose the exact foreground nice case with the pinned artifact
        type: boolean
        default: false
      glob_cli_repro:
        description: Run only the two source60f GlobCliJson artifact diagnostics
        type: boolean
