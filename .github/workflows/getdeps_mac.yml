      run: python3 build/fbcode_builder/getdeps.py --allow-system-packages fetch --no-tests wangle
    - name: Fetch fbthrift
      if: ${{ steps.paths.outputs.fbthrift_SOURCE }}
      run: python3 build/fbcode_builder/getdeps.py --allow-system-packages fetch --no-tests fbthrift
    - name: Fetch fb303
      if: ${{ steps.paths.outputs.fb303_SOURCE }}
      run: python3 build/fbcode_builder/getdeps.py --allow-system-packages fetch --no-tests fb303
    - name: Fetch edencommon
      if: ${{ steps.paths.outputs.edencommon_SOURCE }}
      run: python3 build/fbcode_builder/getdeps.py --allow-system-packages fetch --no-tests edencommon

    - name: Build watchman
      run: python3 build/fbcode_builder/getdeps.py --allow-system-packages build --num-jobs 2 --build-type RelWithDebInfo --src-dir=. watchman --project-install-prefix watchman:/usr/local

    - name: Show sccache stats
      if: always()
      run: sccache --show-stats

    - name: Copy artifacts
      run: python3 build/fbcode_builder/getdeps.py --allow-system-packages fixup-dyn-deps --src-dir=. watchman _artifacts/mac --project-install-prefix watchman:/usr/local --final-install-prefix '@loader_path/..'
    - name: Finalize portable ad-hoc signatures
      run: |
        for library in _artifacts/mac/lib/libglog.2.dylib _artifacts/mac/lib/libssl.1.1.dylib; do
          codesign -d --verbose=4 "$library" 2> "$RUNNER_TEMP/watchman-signature.txt"
          grep -Fx 'Signature=adhoc' "$RUNNER_TEMP/watchman-signature.txt"
          grep -Fx 'TeamIdentifier=not set' "$RUNNER_TEMP/watchman-signature.txt"
          mode=$(stat -f %Lp "$library")
          chmod u+w "$library"
          codesign --force --sign - "$library"
          chmod "$mode" "$library"
        done
        for image in _artifacts/mac/bin/* _artifacts/mac/lib/*; do
          codesign --verify --strict --verbose=2 "$image"
        done
    - uses: actions/upload-artifact@v6
      with:
        name: watchman
        path: _artifacts

    - name: Test watchman
      run: python3 build/fbcode_builder/getdeps.py --allow-system-packages test --num-jobs 2 --build-type RelWithDebInfo --src-dir=. watchman --project-install-prefix watchman:/usr/local

    - name: Show disk space at end
      if: always()
      run: df -h

    - name: Show GitHub Actions cache usage
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh cache list --repo ${{ github.repository }} --sort size_in_bytes --order desc --limit 30

