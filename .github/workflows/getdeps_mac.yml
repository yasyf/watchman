  glob-cli-artifact-repro:
    if: github.event_name == 'workflow_dispatch' && inputs.glob_cli_repro && !inputs.full_suite && !inputs.nice_startup_diagnostic
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        path: controller
    - uses: actions/checkout@v6
      with:
        ref: 60f821ae5c3bf5578025f3699b888e76a7738fcd
        path: source
    - name: Download and verify the exact finalized artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        api="https://api.github.com/repos/yasyf/watchman/actions"
        curl --fail --silent --show-error --location --header "Authorization: Bearer ${GH_TOKEN}" "$api/runs/41210323932" --output producer-run.json
        curl --fail --silent --show-error --location --header "Authorization: Bearer ${GH_TOKEN}" "$api/artifacts/13045919898" --output artifact.json
        python3 - <<'PYTHON'
        import json
        from pathlib import Path
        run = json.loads(Path("producer-run.json").read_text())
        artifact = json.loads(Path("artifact.json").read_text())
        assert run["id"] == 41210323932 and run["head_sha"] == "fce7b2c7aeb4a080dfbd2cdca7ae0099d35c4a53" and run["conclusion"] == "success"
        assert artifact["id"] == 13045919898 and artifact["workflow_run"]["id"] == run["id"] and artifact["workflow_run"]["head_sha"] == run["head_sha"] and not artifact["expired"]
        assert artifact["digest"] == "sha256:ab814eecb17fa308caac6290fa27c91f6bed0eed7ea6d6eb747fbfae6183b0c1"
        PYTHON
        curl --fail --silent --show-error --location --header "Authorization: Bearer ${GH_TOKEN}" "$api/artifacts/13045919898/zip" --output payload.zip
        printf '%s  payload.zip\n' 'ab814eecb17fa308caac6290fa27c91f6bed0eed7ea6d6eb747fbfae6183b0c1' | shasum -a 256 -c -
        unzip -q payload.zip -d payload
        chmod 755 payload/mac/bin/watchman payload/mac/bin/watchmanctl
        images=(payload/mac/bin/* payload/mac/lib/*)
        test "${#images[@]}" -eq 23
        for image in "${images[@]}"; do
          codesign --verify --strict --verbose=2 "$image"
          attributes=$(xattr "$image")
          if printf '%s\n' "$attributes" | grep -Fxq com.apple.quarantine; then exit 1; fi
        done
        test "$(git -C source rev-parse HEAD)" = 60f821ae5c3bf5578025f3699b888e76a7738fcd
        uname -a
        python3 --version
        file payload/mac/bin/watchman
    - name: Synthetic short JSON with a held-open CLI producer
      run: python3 controller/.github/scripts/glob_cli_buffer_probe.py source "${{ runner.temp }}/wm-glob-synthetic"
    - name: Reproduce only GlobCliJson246 and247 with original80s reads observed
      run: python3 controller/.github/scripts/glob_cli_repro.py source payload/mac/bin/watchman "${{ runner.temp }}/wm-glob-repro"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: watchman-glob-cli-repro-source60f
        path: |
          ${{ runner.temp }}/wm-glob-repro
          ${{ runner.temp }}/wm-glob-synthetic

  cli-transport-contract:
    if: github.event_name == 'push' && github.ref == 'refs/heads/host-pressure/cli-transport-contract-20261026'
    runs-on: macos-15
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
    - uses: actions/checkout@v6
      with:
        path: candidate
    - uses: actions/checkout@v6
      with:
        ref: 60f821ae5c3bf5578025f3699b888e76a7738fcd
        path: baseline
    - name: Require the held-open frame regression to fail on the immutable old transport
      run: |
        set +e
        PYTHONPATH=baseline/watchman/python python3 -m unittest discover -s candidate/watchman/python/tests -p test_cli_transport.py -v > negative.log 2>&1
        status=$?
        set -e
        cat negative.log
        test "$status" -ne 0
        grep -F 'CLI hold expired before the frames were decoded' negative.log
        grep -E '^Ran 1 test in [0-9.]+s$' negative.log
        grep -Fx 'FAILED (failures=1)' negative.log
    - name: Run the held-open frame regression on the candidate transport
      run: |
        PYTHONPATH=candidate/watchman/python python3 -m unittest discover -s candidate/watchman/python/tests -p test_cli_transport.py -v > candidate.log 2>&1
        cat candidate.log
        grep -E '^Ran 1 test in [0-9.]+s$' candidate.log
        grep -Fx 'OK' candidate.log
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: cli-transport-contract-macos-15
        path: |
          negative.log
          candidate.log

  nice-startup-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.nice_startup_diagnostic && !inputs.full_suite
    runs-on: macos-15
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - name: Download exact foreground diagnostic artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api repos/yasyf/watchman/actions/artifacts/13092856943/zip > "$RUNNER_TEMP/watchman-nice-diagnostic.zip"
    - name: Diagnose original and explicit-positive foreground startup
      run: python3 -I -B .github/scripts/watchman_nice_diagnostic.py "$RUNNER_TEMP/watchman-nice-diagnostic.zip" "$RUNNER_TEMP/watchman-nice-diagnostic"
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: watchman-nice-startup-diagnostic
        path: ${{ runner.temp }}/watchman-nice-diagnostic/diagnostic.json
        if-no-files-found: error
