  finalize-existing-artifact:
    if: github.event_name == 'workflow_dispatch' && !inputs.glob_cli_repro && !inputs.full_suite && !inputs.nice_startup_diagnostic
    runs-on: macos-15
    timeout-minutes: 10
    steps:
    - name: Download the exact component-graded portable artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        api="https://api.github.com/repos/yasyf/watchman/actions"
        curl --fail --silent --show-error --location --header "Authorization: Bearer ${GH_TOKEN}" "$api/runs/41200186976" --output source-run.json
        curl --fail --silent --show-error --location --header "Authorization: Bearer ${GH_TOKEN}" "$api/artifacts/13044346511" --output source-artifact.json
